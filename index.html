    <title>Lat-Long Sand</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Force unregister legacy service workers and clear caches once to guarantee update on all devices
      const PWA_VERSION = "v11";
      if (localStorage.getItem("pwa_version_control") !== PWA_VERSION) {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker
            .getRegistrations()
            .then((registrations) => {
              for (let reg of registrations) {
                reg.unregister();
              }
              if ("caches" in window) {
                caches
                  .keys()
                  .then((keys) => {
                    return Promise.all(keys.map((key) => caches.delete(key)));
                  })
                  .then(() => {
                    localStorage.setItem("pwa_version_control", PWA_VERSION);
                    window.location.reload();
                  });
              } else {
                localStorage.setItem("pwa_version_control", PWA_VERSION);
                window.location.reload();
              }
            })
            .catch(() => {
              localStorage.setItem("pwa_version_control", PWA_VERSION);
            });
        } else {
          localStorage.setItem("pwa_version_control", PWA_VERSION);
        }
      }

      // Auto-reload on service worker controller change (when new version activates)
      let refreshing = false;
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });

        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js?v=11")
            .then((reg) => {
              // Always check for updates on load and on tab focus
              reg.update().catch(() => {});
              document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "visible") {
                  reg.update().catch(() => {});
                }
              });
            })
            .catch((error) => {
              console.log("ServiceWorker registration failed: ", error);
            });
        });
      }
    </script>
  </body>
</html>
